name: AWC v0.1 conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: abalous2894/witnessdiff
          path: witnessdiff

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install WitnessDiff (reference comparator) + AWC
        run: |
          python -m pip install --upgrade pip
          pip install -e witnessdiff
          pip install -e ".[dev]"

      - name: Run AWC v0.1 profile
        run: awc run-profile awc-v0.1

      - name: Pytest
        run: pytest

      - name: Ruff
        run: ruff check src tests
